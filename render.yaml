services:
  - type: web
    name: subjective-ai-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "5038"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: examdb
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AUTH_SECRET
        generateValue: true
